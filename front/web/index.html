<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Netlab</title>
    <!-- Inline icon: the device would otherwise log a 404 for /favicon.ico on every visit. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Cpath d='M6 21a14 14 0 0 1 20 0M10 17a9 9 0 0 1 12 0M14 13a4 4 0 0 1 4 0' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
    <!-- Before the first paint: the saved theme and density, so a dark page does not flash white. -->
    <script>
      try {
        var modes = JSON.parse(localStorage.getItem('netlab:ui') || '{}');
        if (modes.theme === 'dark' || modes.theme === 'light') document.documentElement.dataset.theme = modes.theme;
        if (modes.density === 'compact') document.documentElement.dataset.density = 'compact';
      } catch (e) { /* storage blocked: the system theme applies */ }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
